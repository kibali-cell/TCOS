[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings_test"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "staticfiles", "apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]
"config/settings/*" = ["F403", "F405"]
