# TCOS development stack: PostgreSQL + Django + React (Vite dev server).
#
# Start:  cp .env.example .env   (then set POSTGRES_PASSWORD)  and  docker compose up --build
# Ports are bound to 127.0.0.1 only; nothing is exposed to the network.
#
# This is the DEVELOPMENT stack. The production build (static React behind a
# TLS-terminating web server) is not part of Slice 0. See docs/STATUS.md.

# Pinned so that renaming or re-extracting the project folder keeps using the same
# database volume (otherwise Compose would create a new, empty one).
name: tcos

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcos}
      POSTGRES_USER: ${POSTGRES_USER:-tcos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tcos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-dev.txt
    restart: unless-stopped
    # Two database identities (Slice 3). Migrations and the role setup run as the owner
    # (DATABASE_URL). The running server then switches to the restricted role
    # (APP_DATABASE_URL), which can only add to the audit log, never change or remove it.
    # Commands you run yourself with "docker compose exec backend ..." use the owner.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py setup_database_roles &&
             DATABASE_URL=$$APP_DATABASE_URL python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-tcos}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tcos}
      APP_DATABASE_URL: postgres://${TCOS_APP_DB_USER:-tcos_app}:${TCOS_APP_DB_PASSWORD:?Set TCOS_APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tcos}
      TCOS_APP_DB_USER: ${TCOS_APP_DB_USER:-tcos_app}
      TCOS_APP_DB_PASSWORD: ${TCOS_APP_DB_PASSWORD:?Set TCOS_APP_DB_PASSWORD in .env}
      TCOS_HOSTING_REGION: ${TCOS_HOSTING_REGION:-}
      # Slice 7: encryption key for two-factor secrets (empty is allowed only in development,
      # where a key is derived from the secret key), link base for reset e-mails, e-mail
      # delivery, and the private file store.
      TCOS_ENCRYPTION_KEY: ${TCOS_ENCRYPTION_KEY:-}
      TCOS_PUBLIC_URL: ${TCOS_PUBLIC_URL:-http://localhost:5173}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-TCOS <no-reply@localhost>}
      TCOS_PRIVATE_STORAGE_ROOT: /var/lib/tcos/private-files
      TCOS_CLAMAV_HOST: ${TCOS_CLAMAV_HOST:-}
      TCOS_REQUIRE_VIRUS_SCAN: ${TCOS_REQUIRE_VIRUS_SCAN:-false}
    volumes:
      - ./backend:/app
      # Uploaded files live here, outside the code folder and outside anything served publicly.
      - tcos_private_files:/var/lib/tcos/private-files
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    # node_modules lives in a named volume, so a slice that changes package-lock.json
    # would otherwise keep the old packages. Reinstall only when the lock file changed.
    command: >
      sh -c "if ! cmp -s package-lock.json node_modules/.tcos-lock; then
               npm install --no-audit --no-fund && cp package-lock.json node_modules/.tcos-lock;
             fi && npm run dev"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - tcos_frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  tcos_pgdata:
  tcos_private_files:
  tcos_frontend_node_modules:
